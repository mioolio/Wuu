<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面歌词</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    #wrap {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px;
      position: relative;
      -webkit-app-region: drag;
    }

    .lyric-row {
      position: relative;
      width: 100%; text-align: center;
      white-space: nowrap;
      transition: opacity 0.3s ease;
      /* 跑马灯模式: 当前行作为裁剪容器 */
      overflow: hidden;
    }
    .lyric-text {
      position: relative;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
    }
    .lyric-base, .lyric-fill {
      display: inline-block;
      font-weight: 700;
      line-height: 1.3;
    }
    .lyric-base {
      color: #ffffff;
      -webkit-text-stroke: 1px rgba(0,0,0,0.6);
      paint-order: stroke fill;
    }
    .lyric-fill {
      position: absolute; left: 0; top: 0;
      color: var(--lyric-color, #ffffff);
      -webkit-text-stroke: 1px rgba(0,0,0,0.5);
      paint-order: stroke fill;
      overflow: hidden;
      width: 0;
      transition: width 0.03s linear, color 0.6s ease;
    }
    /* 跑马灯模式: 文字超出容器时, 用 transform 横向滚动
       双层结构: 外层 .lyric-text 裁剪, 内层 .marquee-track 滚动
       .lyric-base/.lyric-fill 都在 .marquee-track 内, 同步滚动 */
    .lyric-text.marquee {
      overflow: hidden;
    }
    .lyric-text.marquee .marquee-track {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      position: relative;
    }
    .lyric-text.marquee .lyric-base,
    .lyric-text.marquee .lyric-fill {
      display: block;
    }
    .lyric-text.marquee .lyric-fill {
      position: absolute;
      left: 0; top: 0;
    }
    /* 当前行 */
    #cur-row { font-size: 30px; }
    /* 下一行 */
    #next-row { font-size: 18px; font-weight: 500; }
    #next-row .lyric-base { color: #ffffff; }
    #next-row .lyric-fill { display: none; }

    .lyric-row.empty { opacity: 0; }

    /* 过渡: 旧歌词幽灵层 — 向上滑出 + 淡出 (与新当前行上移同步, 形成连续滚动) */
    #ghost {
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      -webkit-text-stroke: 1px rgba(0,0,0,0.6);
      paint-order: stroke fill;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      line-height: 1.3;
      transition: transform 0.42s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.42s ease;
      z-index: 5;
    }
    #ghost.visible { opacity: 1; }
    #ghost.slide-out { transform: translateY(-34px); opacity: 0; }

    /* 当前行: 圆形滚动 — 新文字从下方(下一行位置)先上移到位, 再放大显示
       分两段: 0→40% 上移(easeOutCubic 快速减速), 40%→100% 放大(带轻微回弹) */
    @keyframes cur-in {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.6);
        animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
      }
      40% {
        opacity: 1;
        transform: translateY(0) scale(0.6);
        animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    #cur-row.cur-in {
      animation: cur-in 0.5s;
      transform-origin: center center;
    }

    /* 下一行: 新文字从底部滑入填补空位 (与当前行上移同步) */
    @keyframes next-in {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #next-row.next-in { animation: next-in 0.45s cubic-bezier(0.33, 1, 0.68, 1); }

    /* 控制条 */
    #bar {
      position: absolute; top: 4px; right: 8px;
      display: flex; gap: 4px;
      -webkit-app-region: no-drag;
      opacity: 0; transition: opacity 0.2s;
    }
    #wrap:hover #bar { opacity: 1; }
    #bar button {
      width: 26px; height: 26px; min-width: 26px; min-height: 26px;
      flex-shrink: 0; flex-grow: 0;
      background: rgba(0,0,0,0.5);
      border: none; border-radius: 50%;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      padding: 0;
    }
    #bar button:hover { background: rgba(0,0,0,0.75); }
    #bar svg { width: 14px; height: 14px; }

    #idle {
      font-size: 14px; color: rgba(255,255,255,0.4);
      text-align: center;
    }
    #idle.hidden { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="bar">
      <button id="btn-lock" title="锁定(鼠标穿透)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </button>
      <button id="btn-close" title="关闭桌面歌词">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="ghost"></div>
    <div id="cur-row" class="lyric-row empty">
      <div class="lyric-text">
        <span class="lyric-base"></span>
        <span class="lyric-fill"></span>
      </div>
    </div>
    <div id="next-row" class="lyric-row empty">
      <div class="lyric-text">
        <span class="lyric-base"></span>
        <span class="lyric-fill"></span>
      </div>
    </div>
    <div id="idle">桌面歌词</div>
  </div>
  <script src="desktop-lyric.js"></script>
</body>
</html>

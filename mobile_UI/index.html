<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7f4">
  <script>
    // Resolve a saved override before the stylesheet's first paint.
    (() => {
      let preference = 'system';
      try { const saved = localStorage.getItem('wuu-mobile-theme'); if (['system', 'light', 'dark'].includes(saved)) preference = saved; } catch {}
      const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themePreference = preference;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#121a17' : '#f5f7f4';
      document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = theme === 'dark' ? 'black-translucent' : 'default';
    })();
  </script>
  <title>Wuu 音乐</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
